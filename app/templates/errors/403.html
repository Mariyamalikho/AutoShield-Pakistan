{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <i class="bi bi-shield-lock display-1 text-warning opacity-75 mb-3"></i>
        <h1 class="display-5 fw-bold text-warning">403</h1>
        <h2 class="h4 mb-3">Access Denied</h2>
        <p class="text-secondary mb-4">
            You do not possess the required authorization level or administrative permissions to perform this security operation.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-cyber px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
