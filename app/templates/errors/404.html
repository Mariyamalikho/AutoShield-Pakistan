{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <i class="bi bi-compass display-1 text-secondary opacity-50 mb-3"></i>
        <h1 class="display-5 fw-bold">404</h1>
        <h2 class="h4 mb-3">Audit Resource Not Found</h2>
        <p class="text-secondary mb-4">
            The requested audit record, host specification, or endpoint does not exist or has been relocated.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-teal px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
